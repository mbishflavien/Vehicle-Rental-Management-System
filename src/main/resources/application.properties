spring.application.name=vrms

# Secrets live in application-secrets.properties (git-ignored) or environment variables.
spring.config.import=optional:classpath:application-secrets.properties

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vrms_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# The schema is owned by Flyway migrations (db/migration); Hibernate only checks it matches the entities.
# baseline-version=0 lets V1 upgrade databases created by earlier VRMS versions in place.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- API docs & health ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.info.build.enabled=true

# --- Performance: gzip responses ---
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/javascript,image/svg+xml
server.compression.min-response-size=1024

# --- MongoDB: audit trail, notifications, customer documents (GridFS) ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/vrms}
spring.data.mongodb.auto-index-creation=true

# --- RabbitMQ: business events -> email / SMS / staff alerts ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Retry a failing consumer 3 times (1s, 2s), then dead-letter the message instead of requeueing forever
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Email (SMTP). In development Mailpit catches every message: http://localhost:8025 ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
vrms.mail.from=VRMS Mobility <no-reply@vrms.rw>
vrms.mail.staff-alerts=${STAFF_ALERTS_EMAIL:operations@vrms.rw}
vrms.app.base-url=${APP_BASE_URL:http://localhost:8080}

# --- SMS: Africa's Talking (simulated when no API key is set) ---
vrms.sms.africastalking.username=${AT_USERNAME:sandbox}
vrms.sms.africastalking.api-key=${AT_API_KEY:}
vrms.sms.africastalking.sender-id=${AT_SENDER_ID:}

# Uploads (customer documents)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Security ---
# Base64 secret, >= 256 bits. Override in application-secrets.properties.
vrms.jwt.secret=${JWT_SECRET:}
vrms.jwt.expiration-minutes=1440
vrms.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
# OAuth2 sign-in providers (optional). Redirect URI to register with the provider:
#   http://localhost:8080/login/oauth2/code/google   (and /github; also :5173 when using npm run dev)
vrms.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
vrms.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
vrms.oauth.github.client-id=${GITHUB_CLIENT_ID:}
vrms.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
# Respect X-Forwarded-* headers from the Vite dev proxy or a reverse proxy
server.forward-headers-strategy=framework
# Brute-force protection: failed sign-ins per email+client before a temporary lockout
vrms.security.max-login-attempts=5
vrms.security.lockout-minutes=15

# --- Staff account & demo data (created at startup, see DataSeeder) ---
# Set vrms.admin.password in application-secrets.properties.
vrms.admin.email=${ADMIN_EMAIL:admin@vrms.rw}
vrms.admin.password=${ADMIN_PASSWORD:}
vrms.admin.full-name=Grace Kamanzi
vrms.admin.job-title=Operations Manager
# Demo rental agent (limited permissions). Set vrms.agent.password to create it.
vrms.agent.email=${AGENT_EMAIL:agent@vrms.rw}
vrms.agent.password=${AGENT_PASSWORD:}
vrms.seed.demo-data=true
