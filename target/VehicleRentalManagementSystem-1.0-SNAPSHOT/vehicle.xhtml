<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Vehicle Management - VRMS</title>
    <!-- EXTERNAL CSS -->
    <link rel="stylesheet" type="text/css" href="#{request.contextPath}/resources/css/styles.css"/>

    <!-- INTERNAL CSS -->
    <style>
        .btn-square {
            border: 1px solid #777777;
            border-radius: 0px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-save { background-color: #4a777a; color: #ffffff; }
        .btn-edit { background-color: #d1a153; color: #ffffff; }
        .btn-delete { background-color: #b55353; color: #ffffff; }
        .nav-link { text-decoration: none; font-weight: bold; padding: 4px 8px; }
    </style>
</h:head>
<h:body>
    <div class="main-card">
        <!-- INLINE CSS -->
        <div style="border-bottom: 1px solid #cccccc; padding-bottom: 10px; margin-bottom: 15px;">
            <h2 style="margin: 0; display: inline-block;">Vehicle Management</h2>
            <div style="float: right;">
                <a href="customer.xhtml" class="nav-link" style="color: #666666;">Customers</a> |
                <a href="vehicle.xhtml" class="nav-link" style="color: #4a777a;">Vehicles</a>
            </div>
            <div style="clear: both;"></div>
        </div>

        <h:form id="vehicleForm">
            <h:messages globalOnly="true" style="color: green; font-weight: bold;"/>
            <h:inputHidden value="#{vehicleBean.vehicle.vehicleId}" />

            <!-- Clean Aligned Form Table -->
            <table class="form-table">
                <tr>
                    <td style="width: 25%; font-weight: bold;">Plate Number:</td>
                    <td>
                        <h:inputText id="plate" value="#{vehicleBean.vehicle.plateNumber}" required="true" requiredMessage="Plate required" styleClass="form-input"/>
                        <h:message for="plate" style="color: red; font-size: 11px;"/>
                    </td>
                </tr>
                <tr>
                    <td style="font-weight: bold;">Vehicle Model:</td>
                    <td>
                        <h:inputText id="model" value="#{vehicleBean.vehicle.model}" required="true" requiredMessage="Model required" styleClass="form-input"/>
                        <h:message for="model" style="color: red; font-size: 11px;"/>
                    </td>
                </tr>
                <tr>
                    <td style="font-weight: bold;">Daily Rate ($):</td>
                    <td>
                        <h:inputText id="rate" value="#{vehicleBean.vehicle.dailyRate}" required="true" requiredMessage="Rate required" styleClass="form-input"/>
                        <h:message for="rate" style="color: red; font-size: 11px;"/>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <h:commandButton value="Save Vehicle" action="#{vehicleBean.saveVehicle}" styleClass="btn-square btn-save">
                            <f:ajax execute="@form" render="@form"/>
                        </h:commandButton>
                    </td>
                </tr>
            </table>

            <!-- INLINE CSS -->
            <hr style="border: 0; border-top: 1px solid #dddddd; margin: 20px 0;"/>

            <h3 style="margin-bottom: 10px;">Registered Vehicles</h3>

            <h:dataTable value="#{vehicleBean.vehicleList}" var="v" styleClass="table-grid" id="vehicleTable">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{v.vehicleId}
                </h:column>
                <h:column>
                    <f:facet name="header">Plate Number</f:facet>
                    #{v.plateNumber}
                </h:column>
                <h:column>
                    <f:facet name="header">Model</f:facet>
                    #{v.model}
                </h:column>
                <h:column>
                    <f:facet name="header">Daily Rate</f:facet>
                    $#{v.dailyRate}
                </h:column>
                <h:column>
                    <f:facet name="header">Status</f:facet>
                    #{v.status}
                </h:column>
                <h:column>
                    <f:facet name="header">Actions</f:facet>
                    <h:commandButton value="Edit" action="#{vehicleBean.editVehicle(v)}" styleClass="btn-square btn-edit">
                        <f:ajax render=":vehicleForm"/>
                    </h:commandButton>
                    &#160;
                    <h:commandButton value="Delete" action="#{vehicleBean.deleteVehicle(v)}" styleClass="btn-square btn-delete"
                                     onclick="return confirm('Delete this record?');">
                        <f:ajax render=":vehicleForm"/>
                    </h:commandButton>
                </h:column>
            </h:dataTable>
        </h:form>
    </div>
</h:body>
</html>
