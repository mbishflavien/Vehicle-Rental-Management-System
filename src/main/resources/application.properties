spring.application.name=vrms

# Secrets live in application-secrets.properties (git-ignored) or environment variables.
spring.config.import=optional:classpath:application-secrets.properties

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vrms_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Security ---
# Base64 secret, >= 256 bits. Override in application-secrets.properties.
vrms.jwt.secret=${JWT_SECRET:}
vrms.jwt.expiration-minutes=1440
vrms.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
# Brute-force protection: failed sign-ins per email+client before a temporary lockout
vrms.security.max-login-attempts=5
vrms.security.lockout-minutes=15

# --- Staff account & demo data (created at startup, see DataSeeder) ---
# Set vrms.admin.password in application-secrets.properties.
vrms.admin.email=${ADMIN_EMAIL:admin@vrms.rw}
vrms.admin.password=${ADMIN_PASSWORD:}
vrms.admin.full-name=Grace Kamanzi
vrms.admin.job-title=Operations Manager
# Demo rental agent (limited permissions). Set vrms.agent.password to create it.
vrms.agent.email=${AGENT_EMAIL:agent@vrms.rw}
vrms.agent.password=${AGENT_PASSWORD:}
vrms.seed.demo-data=true
